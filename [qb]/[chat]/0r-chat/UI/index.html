<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/v1-style.css" />
    <link rel="stylesheet" href="styles/v2-style.css" />
    <link rel="stylesheet" href="styles/v3-style.css" />
    <script src="scripts/jquery.js"></script>
    <script src="scripts/debug.js"></script>
    <script src="scripts/emoji.js"></script>
    <script src="scripts/script.js"></script>
    <title>0R-Chat V2</title>
  </head>
  <body>
    <div class="container">
      <div style="visibility: hidden" class="message-box">
        <div class="col"></div>
      </div>
      <div style="display: none" class="chat-input-part">
        <div class="chat-input">
          <input
            id="chat-text-input"
            placeholder="Enter message..."
            type="text"
          />
          <div id="notification" class="notification">
            <img src="img/bell.png" />
          </div>
          <div style="display: none" class="chat-emoji-menu"></div>
        </div>
        <div>
          <div class="chat-buttons" style="display: none">
            <div class="chat-emoji">
              <img id="chat-emoji-icon" src="img/emoji.svg" title="emoji" />
            </div>
            <div class="chat-setting">
              <img
                id="chat-setting-icon"
                src="img/setting-icon.svg"
                title="setting"
              />
            </div>
          </div>
        </div>
      </div>
      <div class="suggestions-container">
        <div style="visibility: hidden" class="suggestions"></div>
      </div>
    </div>
    <div class="settings-menu">
      <div class="relative">
        <div class="header">
          <div class="title">CHAT SETTINGS</div>
          <div class="exit">
            <div class="text">
              <div>EXIT FROM</div>
              <div>SETTINGS</div>
            </div>
            <div class="x">
              <img src="./img/x.png" alt="x" title="x" />
            </div>
          </div>
        </div>
        <div class="body">
          <div class="chat-type" data-version="v1">
            <div>Style O</div>
          </div>
          <div class="chat-type" data-version="v2">
            <div>Style N</div>
          </div>
          <div class="chat-type" data-version="v3">
            <div>Style F</div>
          </div>
        </div>
        <div class="bottom">
          <div class="position">
            <div class="title">
              <img src="./img/setting-icon.svg" alt="setting" />
              <div>Chat Position - Right</div>
            </div>
            <div class="input">
              <input type="checkbox" id="checkboxInput" />
              <label for="checkboxInput" class="toggleSwitch"> </label>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="song" style="display: none">
      <div>
        <div class="icon">
          <img src="./img/voiceprint.gif" alt="voiceprint" title="voiceprint" />
        </div>
        <div class="song-title"></div>
      </div>
    </div>
  </body>
</html>
