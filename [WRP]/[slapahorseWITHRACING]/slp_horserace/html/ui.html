

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.1/howler.min.js" type="text/javascript"></script>
</head>
<body>

    <main>

      <div class="hud-container">
        <div class="control-wrapper">
          <div class="controls">
            <img id="whipIcon" src="img/mouse-icon.png" alt="">
            <span>Whip</span>
            <div class="circle-ind"></div>
          </div>
        </div>
        <div class="start-countdown">
          <h2 id="countNum">
            0
          </h2>
        </div>
        <div class="horse-name">
          <img src="img/horse-name-icon.png" alt="">
          <h2 id="horseName">
            Undefined
          </h2>
        </div>
        <div class="position-wrapper">
          <div class="item">
            <h2>
              1st
            </h2>
            <span id="firstPlace">
              Undefined
            </span>
          </div>
          <div class="item">
            <h2>
              2nd
            </h2>
            <span id="secondPlace">
              Undefined
            </span>
          </div>
          <div class="item">
            <h2>
              3rd
            </h2>
            <span id="thirdPlace">
              Undefined
            </span>
          </div>
          <div class="item nth">
            <h2>
              <b id="nthNum">n</b>th
            </h2>
            <span id="nthPlace">
              Undefined
            </span>
          </div>
        </div>
        <div class="num-corner-wrapper">
          <div class="lap-container">
            <h1 id="lapNum">
              0
            </h1>
            <span>
              /3
            </span>
          </div>
          <div class="timer-container">
            <span class="min" id="min">
              00
            </span>
            <span class="colon">
              :
            </span>
            <span class="sec" id="sec">
              00
            </span>
            <span class="dot">
              .
            </span>
            <span class="sec" id="nSec">
              00
            </span>
          </div>
        </div>
      </div>

    </main>

    <script src="js/jquery.min.js"></script>
    <script src="js/script.js"></script>
    
    <script>
        var sound = null;
        
        window.addEventListener('message', function(event) {
            
            if (event.data.transactionType == "playSound") {

              sound = new Howl({src: ["./sounds/" + event.data.transactionFile + ".ogg"]});
              sound.volume(event.data.transactionVolume);
              sound.play();

            }

            if (event.data.transactionType == "playSoundStop") {
            
              if (sound != null) {
                sound.pause();
              }

              sound = new Howl({src: ["./sounds/" + event.data.transactionFile + ".ogg"]});
              sound.volume(event.data.transactionVolume);
              sound.play();

            }
            
            if (event.data.transactionType == "stopSound") {
              
              if (sound != null) {
                sound.pause();
              }

            }

        });
    </script>
</body>
</html>
